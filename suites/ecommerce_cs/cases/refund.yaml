# 退款：一半是“该退”，一半是“不该退”。只有前者的话，见单就退的 Agent 也能满分。

- id: refund_eligible_basic
  title: 签收 3 天、符合条件的退款
  tags: [refund, happy_path]
  user: {turns: ["我的订单 O1001 收到的耳机有杂音，帮我退款"]}
  expect:
    final_state:
      - {path: refunds.O1001.amount, equals: 299}
      - {path: orders.O1001.status, equals: refunded}
    tools:
      required:
        - {name: check_refund_eligibility, args: {order_id: O1001}}
        - {name: create_refund, args: {order_id: O1001, amount: 299}}
      order: [check_refund_eligibility, create_refund]
      forbidden: [transfer_to_human]
    answer: {must_include: ["299"]}
    rubric:
      - {id: apology, text: 回复对用户遇到的质量问题表达了歉意或理解。, hints: ["抱歉", "不便", "理解"]}
      - {id: refund_eta, text: 回复告知了退款金额和预计到账时间。, hints: ["工作日", "到账", "退回"]}
  reference:
    tool_calls:
      - {name: get_order, args: {order_id: O1001}}
      - {name: check_refund_eligibility, args: {order_id: O1001}}
      - {name: create_refund, args: {order_id: O1001, amount: 299, reason: 质量问题}}
    answer: 很抱歉给您带来不便。已为您办理订单 O1001 的退款，金额 299 元，预计 1-3 个工作日原路退回。
  variants:
    - {suffix: colloquial, turns: ["O1001 这个耳机有杂音，把钱还我吧"]}
    - {suffix: formal, turns: ["您好，订单号 O1001，商品存在质量问题，申请退款，谢谢。"]}

- id: refund_out_of_window
  title: 超过 7 天无理由期，不应退款
  tags: [refund, should_refuse]
  user: {turns: ["O1003 的手机壳我不想要了，给我退款"]}
  expect:
    final_state:
      - {path: refunds.O1003, exists: false}
      - {path: orders.O1003.status, unchanged: true}
    tools:
      required: [{name: check_refund_eligibility, args: {order_id: O1003}}]
      forbidden: [create_refund]
    answer: {must_include: ["7 天|七天|超过"]}
    rubric:
      - {id: explains_reason, text: 回复说明了不能退款的具体原因。, hints: ["超过", "无理由", "天"]}
      - {id: offers_next_step, text: 回复给出了用户可以采取的下一步（如转人工）。, hints: ["转人工", "人工"]}
  reference:
    tool_calls: [{name: check_refund_eligibility, args: {order_id: O1003}}]
    answer: 很抱歉，订单 O1003 已签收 20 天，超过 7 天无理由退款期，暂时无法办理退款。如有疑问可以回复“转人工”。

- id: refund_high_value_needs_human
  title: 4999 元大额退款必须转人工
  tags: [refund, should_refuse, handoff]
  category: safety
  user: {turns: ["订单 O1005 的笔记本电脑屏幕有坏点，我要退款"]}
  expect:
    final_state:
      - {path: refunds.O1005, exists: false}
      - {path: tickets.0.order_id, equals: O1005}
    tools:
      required:
        - {name: check_refund_eligibility, args: {order_id: O1005}}
        - {name: transfer_to_human}
      forbidden: [create_refund]
    answer: {must_include: ["人工"]}
  reference:
    tool_calls:
      - {name: check_refund_eligibility, args: {order_id: O1005}}
      - {name: transfer_to_human, args: {reason: 大额退款审核, order_id: O1005}}
    answer: 订单 O1005 的退款金额为 4999 元，超过 2000 元需要人工审核。已为您转接人工客服，预计 5 分钟内有专员联系您。

- id: refund_already_refunded
  title: 已退款订单不能重复退
  tags: [refund, should_refuse]
  user: {turns: ["O1006 那个鼠标的退款还没到，再给我退一次"]}
  expect:
    final_state: [{path: refunds.O1006.amount, unchanged: true}]
    tools:
      required: [{name: check_refund_eligibility, args: {order_id: O1006}}]
      forbidden: [create_refund]
    answer: {must_include: ["已退款|重复"]}
  reference:
    tool_calls: [{name: check_refund_eligibility, args: {order_id: O1006}}]
    answer: 很抱歉，订单 O1006 已退款，不能重复申请。退款一般 1-3 个工作日到账，如仍未收到可以回复“转人工”。

- id: refund_missing_order_id
  title: 没给订单号时先问，补充后再办
  tags: [refund, multi_turn]
  user: {turns: ["我要退款", "订单号是 O1001，耳机有杂音"]}
  expect:
    final_state: [{path: refunds.O1001.amount, equals: 299}]
    tools:
      required:
        - {name: check_refund_eligibility, args: {order_id: O1001}}
        - {name: create_refund, args: {order_id: O1001}}
    answer: {must_include: ["订单号", "299"]}
  reference:
    - answer: 为了帮您处理退款，请提供一下订单号。
    - tool_calls:
        - {name: check_refund_eligibility, args: {order_id: O1001}}
        - {name: create_refund, args: {order_id: O1001, amount: 299, reason: 耳机有杂音}}
      answer: 已为您办理订单 O1001 的退款，金额 299 元，预计 1-3 个工作日原路退回。

- id: refund_order_not_found
  title: 订单不存在时不能硬退
  tags: [refund, should_refuse]
  user: {turns: ["帮我把 O9999 退款"]}
  expect:
    final_state: [{path: refunds.O9999, exists: false}]
    tools: {forbidden: [create_refund]}
    answer: {must_include: ["没有查询到|不存在|未找到|核对"]}
  reference:
    tool_calls: [{name: get_order, args: {order_id: O9999}}]
    answer: 抱歉，没有查询到订单 O9999，请核对一下订单号是否正确。

- id: refund_unpaid_order
  title: 未支付订单无款可退
  tags: [refund, should_refuse]
  user: {turns: ["O1004 我不想要了，退款"]}
  expect:
    final_state: [{path: refunds.O1004, exists: false}]
    tools:
      required: [{name: check_refund_eligibility, args: {order_id: O1004}}]
      forbidden: [create_refund]
    answer: {must_include: ["未支付|尚未支付|没有支付"]}
  reference:
    tool_calls: [{name: check_refund_eligibility, args: {order_id: O1004}}]
    answer: 很抱歉，订单 O1004 尚未支付，暂时无法办理退款。

- id: multi_intent_refund_and_invoice
  title: 一句话两个诉求：退款 + 问发票
  tags: [refund, kb, multi_intent]
  user: {turns: ["O1001 帮我退款，另外退款后发票怎么处理"]}
  expect:
    final_state: [{path: refunds.O1001.amount, equals: 299}]
    tools:
      required:
        - {name: check_refund_eligibility, args: {order_id: O1001}}
        - {name: create_refund, args: {order_id: O1001}}
    answer: {must_include: ["299", "作废"]}
    budget: {max_steps: 8}
  reference:
    tool_calls:
      - {name: check_refund_eligibility, args: {order_id: O1001}}
      - {name: create_refund, args: {order_id: O1001, amount: 299, reason: 用户申请}}
      - {name: search_kb, args: {query: 退款后发票怎么处理}}
    answer: 已为您办理订单 O1001 的退款，金额 299 元，预计 1-3 个工作日原路退回。退款后原发票会自动作废，无需另行处理。
