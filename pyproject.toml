[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval-hub"
version = "0.1.0"
description = "Agent 与 LLM 评测中台：7 维评估、沙箱隔离、分级裁判、调度引擎、质量门禁、Badcase 闭环"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pyyaml>=6", "jinja2>=3"]

[project.optional-dependencies]
claude = ["anthropic>=2.8"]   # 需要支持 output_config；2.8.0 是实际验证过的版本
openai = ["openai>=1.40"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[project.scripts]
evalhub = "evalhub.cli:main"

[tool.setuptools.packages.find]
include = ["evalhub*"]
